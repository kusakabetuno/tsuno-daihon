<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台本管理ツール | 草壁ツノ</title><link rel="stylesheet" href="css/style.css"><style>
.admin{max-width:900px;margin:auto;padding:34px 22px 70px}.admin h1{margin:0 0 8px}.note{color:var(--muted);line-height:1.7}.adminPanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:24px 0}.grid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px}.grid .wide{grid-column:1/-1}.admin label{font-size:13px;font-weight:700}.admin input{display:block;width:100%;height:44px;margin-top:5px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.admin button,.fileBtn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent)!important}.danger{color:#a33}.adminList{display:grid;gap:10px}.adminItem{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;justify-content:space-between;align-items:center}.adminItem strong{display:block}.adminItem small{color:var(--muted)}.fileBtn input{display:none}.status{margin-top:12px;font-size:13px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.grid .title,.grid .wide{grid-column:1/-1}.adminItem{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin"><p class="eyebrow">LOCAL ADMIN TOOL</p><h1>台本管理ツール</h1><p class="note">このページで新規登録・編集・削除ができます。変更後に「scripts.json を保存」を押し、GitHub の <b>data/scripts.json</b> と差し替えてください。公開サイトを直接書き換える機能ではありません。</p>
<div class="adminPanel"><div class="actions"><label class="fileBtn">現在の scripts.json を読み込む<input id="file" type="file" accept="application/json,.json"></label><button id="loadSite">サイトのデータを読み込む</button></div><div id="status" class="status">最初にデータを読み込んでください。</div></div>
<div class="adminPanel"><h2 id="formTitle">台本を新規登録</h2><div class="grid"><label class="title">タイトル<input id="title"></label><label>男性<input id="male" type="number" min="0" value="0"></label><label>女性<input id="female" type="number" min="0" value="0"></label><label>不問<input id="any" type="number" min="0" value="0"></label><label>時間（分）<input id="minutes" type="number" min="1" value="10"></label><label class="wide">ジャンル（複数は「,」区切り）<input id="genres" placeholder="ファンタジー, ラブコメ"></label><label class="wide">台本URL<input id="url" type="url" placeholder="https://..."></label></div><div class="actions"><button id="save" class="primary">新規登録する</button><button id="cancel" hidden>編集をやめる</button></div></div>
<div class="adminPanel"><h2>登録済み台本</h2><div id="list" class="adminList"></div></div>
<div class="adminPanel"><h2>GitHubへ反映</h2><p class="note">編集が終わったら保存してください。ダウンロードされたファイル名は <b>scripts.json</b> です。</p><button id="download" class="primary">scripts.json を保存</button></div><p><a href="index.html">← トップページへ戻る</a></p></main><script src="js/admin.js"></script></body></html>
