<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理画面ログイン | 草壁ツノ</title><link rel="stylesheet" href="css/style.css"><style>
.loginPage{min-height:80vh;display:flex;align-items:center;justify-content:center}.loginBox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}.loginBox h1{margin:4px 0 10px;font-size:27px}.loginBox p{color:var(--muted);line-height:1.7}.loginBox input{width:100%;height:48px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;margin:8px 0 12px}.loginBox button{width:100%;height:48px;border:1px solid var(--line);border-radius:9px;background:var(--accent);font-weight:700;cursor:pointer}.error{min-height:1.5em;color:#a33!important;font-size:13px}.back{display:block;margin-top:18px;color:inherit;text-align:center;font-size:13px}</style></head><body><main class="loginPage"><section class="loginBox"><p class="eyebrow">ADMIN</p><h1>管理画面</h1><p>管理用パスワードを入力してください。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" aria-label="管理用パスワード"><button type="submit">管理画面を開く</button><p id="error" class="error"></p></form><a class="back" href="index.html">← トップページへ戻る</a></section></main><script>
const expected="c4cbfc9b8805e9f30d12784d238136c928c7b08354a35f88b7034fc39580a0e8";
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const v=document.getElementById("password").value;if(await sha256(v)===expected){sessionStorage.setItem("tsunoAdminAuth","ok");location.href="admin.html"}else{document.getElementById("error").textContent="パスワードが違います。"}});
</script></body></html>
